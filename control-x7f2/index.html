<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>nova / control</title>
<style>
  :root {
    --bg: #0e0e10; --bg-side: #0a0a0c; --bg-elevated: #191919;
    --border: #2a2a2c; --text: #ececec; --text-dim: #a8a8ad; --text-faint: #6e6e73;
    --accent: #10a37f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .gate { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 320px; padding: 28px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; }
  .gate-box h1 { font-size: 16px; margin: 0 0 16px; color: var(--text-dim); font-weight: 500; }
  .gate-box input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none; }
  .gate-box input:focus { border-color: var(--accent); }
  .gate-box button { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 8px;
    color: #fff; font-size: 14px; cursor: pointer; }
  .gate-error { color: #e5534b; font-size: 12.5px; margin-top: 8px; min-height: 16px; }

  .app { display: none; height: 100vh; }
  .app.show { display: flex; }
  .list { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg-side); }
  .list-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-faint); }
  .conv { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .conv:hover, .conv.active { background: var(--bg-elevated); }
  .conv .title { font-size: 13.5px; color: var(--text); margin-bottom: 4px; }
  .conv .preview { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; }

  .thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .thread-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 14px; }
  .thread-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .thread-header .id { font-size: 13px; color: var(--text-faint); }
  .thread-header button { background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
  .thread-header button:hover { background: var(--bg-elevated); }
  .thread-msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .tmsg { max-width: 70%; padding: 9px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .tmsg.friend { background: var(--bg-elevated); align-self: flex-start; }
  .tmsg.me { background: var(--accent); color: #fff; align-self: flex-end; }
  .quick-replies { display: flex; gap: 6px; padding: 0 20px 10px; flex-wrap: wrap; }
  .quick-replies button { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 14px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .quick-replies button:hover { background: #212121; }
  .reply-box { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .reply-box textarea { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit; resize: none; outline: none; }
  .reply-box button { background: var(--accent); border: none; border-radius: 10px; color: #fff; padding: 0 18px;
    font-size: 14px; cursor: pointer; }
  .reply-box button:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>control panel</h1>
    <input type="password" id="passInput" placeholder="passphrase" autocomplete="off" />
    <input type="password" id="tokenInput" placeholder="your GitHub token (Issues r/w)" autocomplete="off" style="display:none" />
    <button id="gateBtn">Enter</button>
    <div class="gate-error" id="gateError"></div>
    <div style="text-align:center;margin-top:10px">
      <a href="#" id="resetTokenLink" style="font-size:11.5px;color:var(--text-faint)">wrong token? reset it</a>
    </div>
  </div>
</div>

<div class="app" id="app">
  <div class="list">
    <div class="list-header">Active conversations</div>
    <div id="listStatus" style="padding:10px 16px;font-size:12.5px;color:#e5534b;display:none"></div>
    <div id="convList"></div>
  </div>
  <div class="thread" id="thread">
    <div class="thread-empty">Select a conversation</div>
  </div>
</div>

<script src="../config.js"></script>
<script src="admin.js"></script>
</body>
</html>
